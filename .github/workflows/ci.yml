name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: build + test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The test runner needs Node 20+. The published CLI still supports
        # Node 18; the runtime job below verifies that.
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  runtime-node18:
    name: CLI runtime (node 18)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node 22 for the build
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Switch to Node 18
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 18

      - name: Run the compiled CLI on Node 18
        run: |
          set -euo pipefail
          node --version | grep -q '^v18\.'
          node dist/cli.js --version
          node dist/cli.js --help > /dev/null

          # Read-only analysis of a synthetic corpus in a throwaway HOME.
          SMOKE_HOME="$(mktemp -d "$RUNNER_TEMP/cache-refund-home-XXXXXX")"
          mkdir -p "$SMOKE_HOME/.claude/projects/smoke-project"
          cp test/fixtures/basic-5m.jsonl "$SMOKE_HOME/.claude/projects/smoke-project/smoke-session.jsonl"
          HOME="$SMOKE_HOME" CI=1 node dist/cli.js --json --no-share --all-time > "$RUNNER_TEMP/summary.json"

          node -e '
            const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            if (!(s.scope.turns > 0)) throw new Error("no turns analyzed");
            if (!(s.tokens.creation5m > 0)) throw new Error("no 5m cache writes counted");
            console.log("analyzed " + s.scope.turns + " turns on " + process.version);
          ' "$RUNNER_TEMP/summary.json"

          # The analysis must not write anything under HOME.
          test "$(find "$SMOKE_HOME" -type f | wc -l)" -eq 1
